# Pipeline DevOps Multistage - Bakery Core API
# Estructura: CI → Testing → Delivery
# Trigger automático en cambios en main

trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: bakery-secrets
  - name: imageName
    value: 'bakery-core'
  - name: imageTag
    value: '$(Build.BuildId)'
  - name: nodeVersion
    value: '24.15.0'

stages:
  # ============================================================================
  # STAGE 1: CI (Integración Continua)
  # ============================================================================
  - stage: CI
    displayName: 'Stage 1: CI - Integración Continua'
    jobs:
      - job: 'BuildJob'
        displayName: 'Build: Compilar aplicación'
        steps:
          - task: UseNode@1
            displayName: 'Instalar Node.js SDK (v$(nodeVersion))'
            inputs:
              version: '$(nodeVersion)'

          - script: |
              corepack enable
              corepack prepare pnpm@9.15.9 --activate
            displayName: 'Restaurar: Activar pnpm'

          - script: |
              pnpm install --frozen-lockfile --ignore-scripts
            displayName: 'Restaurar: Instalar dependencias con pnpm'

          - script: |
              pnpm run build
            displayName: 'Compilar: Build NestJS project'

          # MODIFICADO: Ahora incluimos el Dockerfile en los artefactos
          - task: CopyFiles@2
            displayName: 'Preparar: Empaquetar artefactos para entrega'
            inputs:
              SourceFolder: '$(Build.SourcesDirectory)'
              Contents: |
                dist/**
                package.json
                pnpm-lock.yaml
                Dockerfile
              TargetFolder: '$(Build.ArtifactStagingDirectory)'

          - task: PublishBuildArtifacts@1
            displayName: 'Publicar: Artefactos de build'
            inputs:
              pathToPublish: '$(Build.ArtifactStagingDirectory)'
              artifactName: 'dist-output'

  # ============================================================================
  # STAGE 2: Testing (Pruebas y Validación de Calidad)
  # ============================================================================
  - stage: Testing
    displayName: 'Stage 2: Testing - Validación de Calidad'
    dependsOn: CI
    condition: succeeded()
    jobs:
      - job: TestJob
        displayName: 'Test: Ejecutar validations'
        steps:
          - task: UseNode@1
            displayName: 'Instalar Node.js SDK (v$(nodeVersion))'
            inputs:
              version: '$(nodeVersion)'

          - script: |
              corepack enable
              corepack prepare pnpm@9.15.9 --activate
              pnpm install --frozen-lockfile --ignore-scripts
            displayName: 'Restaurar: Instalar dependencias'

          - script: |
              pnpm run build
            displayName: 'Compilar: Build NestJS project'

          - script: |
              docker build \
                --tag $(imageName):$(imageTag) \
                --tag $(imageName):latest \
                .
            displayName: 'Test: Construir imagen Docker'

          - script: |
              docker run -d \
                --name bakery-test \
                -p 3000:3000 \
                -e DATABASE_URL="$(DATABASE_URL)" \
                -e PORT="$(PORT)" \
                -e API_PREFIX="$(API_PREFIX)" \
                $(imageName):latest
              echo "✓ Contenedor iniciado"
            displayName: 'Test: Ejecutar contenedor'

          - script: |
              echo "Esperando que la app inicie..."
              sleep 15
              if curl --fail http://localhost:3000/$(API_PREFIX); then
                echo "✓ OK - La app responde correctamente"
              else
                echo "✗ ERROR - La app no responde"
                exit 1
              fi
            displayName: 'Test: Validar funcionamiento (Health Check)'

          - script: |
              echo "=== Logs del contenedor ==="
              docker logs bakery-test
            displayName: 'Test: Mostrar estado y logs'
            condition: always()

          - script: |
              docker stop bakery-test
              docker rm bakery-test
              echo "✓ Contenedor de prueba limpiado"
            displayName: 'Test: Limpiar recursos'
            condition: always()

  # ============================================================================
  # STAGE 3: Delivery (Entrega y Despliegue en Docker)
  # ============================================================================
  - stage: Delivery
    displayName: 'Stage 3: Delivery - Entrega a Producción'
    dependsOn: Testing
    condition: succeeded()
    jobs:
      - job: DeliveryJob
        displayName: 'Deploy: Publicar en Digital Ocean con Docker'
        steps:
          - task: DownloadBuildArtifacts@0
            displayName: 'Deploy: Descargar artefactos de build'
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'dist-output'
              downloadPath: '$(System.ArtifactsDirectory)'

          - task: CopyFilesOverSSH@0
            displayName: 'Deploy: Enviar artefactos al servidor'
            inputs:
              sshEndpoint: 'digital_ocean_core'
              sourceFolder: '$(System.ArtifactsDirectory)/dist-output'
              contents: '**'
              targetFolder: '/var/www/bakery-core'
              cleanTargetFolder: false
              readyTimeout: '30000'

          - task: SSH@0
            displayName: 'Deploy: Construir y levantar Contenedor Docker'
            inputs:
              sshEndpoint: 'digital_ocean_core'
              runOptions: 'inline'
              failOnStdErr: false
              inline: |
                echo "=== Iniciando despliegue con Docker ==="
                
                # 1. Entrar a la carpeta del proyecto en el droplet
                cd /var/www/bakery-core
                echo "✓ Directorio actual: $(pwd)"

                # 2. PROTEGER EL ARCHIVO .ENV 
                # Si no existe, crea uno vacío para que Docker no falle. 
                # Si ya existe, NO lo toca para que puedas editarlo manualmente.
                if [ ! -f .env ]; then
                  echo "Archivo .env no encontrado. Creando uno base..."
                  echo "PORT=3000" > .env
                  echo "NODE_ENV=production" >> .env
                else
                  echo "✓ Archivo .env detectado. Se mantendrán tus variables manuales."
                fi

                # 3. Construir la imagen Docker en producción utilizando los artefactos recibidos
                echo "Construyendo imagen de producción..."
                docker build -t bakery-core:latest .

                # 4. Detener y remover el contenedor anterior si existe
                echo "Limpiando contenedores antiguos..."
                docker stop bakery-core-prod || true
                docker rm bakery-core-prod || true

                # 5. Levantar el nuevo contenedor mapeando el puerto 3000 e inyectando tu .env manual
                echo "Iniciando nuevo contenedor..."
                docker run -d \
                  --name bakery-core-prod \
                  -p 3000:3000 \
                  --env-file .env \
                  --restart always \
                  bakery-core:latest

                echo "=== Verificación del despliegue ==="
                docker ps | grep bakery-core-prod
              readyTimeout: '30000'