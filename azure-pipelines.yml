# Pipeline DevOps Multistage - Bakery Core API
# Estructura: CI → Testing → Delivery
# Trigger automático en cambios en main

trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: bakery-secrets
  - name: imageName
    value: 'bakery-core'
  - name: imageTag
    value: '$(Build.BuildId)'
  - name: nodeVersion
    value: '24.15.0'

stages:
  # ============================================================================
  # STAGE 1: CI (Integración Continua)
  # Objetivo: Validar que el código compila y publicar artefactos para entrega
  # ============================================================================
  - stage: CI
    displayName: 'Stage 1: CI - Integración Continua'
    jobs:
      - job: BuildJob
        displayName: 'Build: Compilar aplicación'
        steps:
          # Paso 1: Instalar SDK de Node.js
          - task: UseNode@1
            displayName: 'Instalar Node.js SDK (v$(nodeVersion))'
            inputs:
              version: '$(nodeVersion)'

          # Paso 2: Restaurar dependencias
          - script: |
              corepack enable
              corepack prepare pnpm@9.15.9 --activate
            displayName: 'Restaurar: Activar pnpm'

          - script: |
              pnpm install --frozen-lockfile --ignore-scripts
            displayName: 'Restaurar: Instalar dependencias con pnpm'

          # Paso 3: Compilar aplicación
          - script: |
              pnpm run build
            displayName: 'Compilar: Build NestJS project'

          # Paso 4: Empaquetar artefactos (dist + manifests)
          - task: CopyFiles@2
            displayName: 'Preparar: Empaquetar artefactos para entrega'
            inputs:
              SourceFolder: '$(Build.SourcesDirectory)'
              Contents: |
                dist/**
                package.json
                pnpm-lock.yaml
              TargetFolder: '$(Build.ArtifactStagingDirectory)'

          # Paso 5: Publicar artefactos de build
          - task: PublishBuildArtifacts@1
            displayName: 'Publicar: Artefactos de build'
            inputs:
              pathToPublish: '$(Build.ArtifactStagingDirectory)'
              artifactName: 'dist-output'

  # ============================================================================
  # STAGE 2: Testing (Pruebas y Validación de Calidad)
  # Objetivo: Construir imagen Docker y validar que la app arranca correctamente
  # Condición: Solo se ejecuta si CI es exitoso
  # ============================================================================
  - stage: Testing
    displayName: 'Stage 2: Testing - Validación de Calidad'
    dependsOn: CI
    condition: succeeded()
    jobs:
      - job: TestJob
        displayName: 'Test: Ejecutar validaciones'
        steps:
          # Paso 1: Instalar Node.js SDK
          - task: UseNode@1
            displayName: 'Instalar Node.js SDK (v$(nodeVersion))'
            inputs:
              version: '$(nodeVersion)'

          # Paso 2: Instalar dependencias
          - script: |
              corepack enable
              corepack prepare pnpm@9.15.9 --activate
              pnpm install --frozen-lockfile --ignore-scripts
            displayName: 'Restaurar: Instalar dependencias'

          # Paso 3: Compilar para tests
          - script: |
              pnpm run build
            displayName: 'Compilar: Build NestJS project'

          # Paso 4: Construir imagen Docker
          - script: |
              docker build \
                --tag $(imageName):$(imageTag) \
                --tag $(imageName):latest \
                .
            displayName: 'Test: Construir imagen Docker'

          # Paso 5: Ejecutar contenedor con variables de entorno
          - script: |
              docker run -d \
                --name bakery-test \
                -p 3000:3000 \
                -e DATABASE_URL="$(DATABASE_URL)" \
                -e PORT="$(PORT)" \
                -e API_PREFIX="$(API_PREFIX)" \
                $(imageName):latest
              echo "✓ Contenedor iniciado"
            displayName: 'Test: Ejecutar contenedor'

          # Paso 6: Validar que la app responde correctamente
          - script: |
              echo "Esperando que la app inicie..."
              sleep 15
              if curl --fail http://localhost:3000/$(API_PREFIX); then
                echo "✓ OK - La app responde correctamente"
              else
                echo "✗ ERROR - La app no responde"
                exit 1
              fi
            displayName: 'Test: Validar funcionamiento (Health Check)'

          # Paso 7: Mostrar logs y estado
          - script: |
              echo "=== Logs del contenedor ==="
              docker logs bakery-test
              echo ""
              echo "=== Imagen generada ==="
              docker images | grep $(imageName)
              echo ""
              echo "=== Contenedor en ejecución ==="
              docker ps | grep bakery-test
            displayName: 'Test: Mostrar estado y logs'
            condition: always()

          # Paso 8: Ejecutar pruebas unitarias (si existen)
          - script: |
              pnpm run test || echo "No hay tests configurados"
            displayName: 'Test: Ejecutar pruebas unitarias'
            condition: always()

          # Paso 9: Limpiar contenedor de prueba
          - script: |
              docker stop bakery-test
              docker rm bakery-test
              echo "✓ Contenedor de prueba limpiado"
            displayName: 'Test: Limpiar recursos'
            condition: always()

  # ============================================================================
  # STAGE 3: Delivery (Entrega y Despliegue)
  # Objetivo: Enviar artefactos al servidor y reiniciar la aplicación con PM2
  # Condición: Solo se ejecuta si CI y Testing son exitosos
  # ============================================================================
  - stage: Delivery
    displayName: 'Stage 3: Delivery - Entrega a Producción'
    dependsOn: Testing
    condition: succeeded()
    jobs:
      - job: DeliveryJob
        displayName: 'Deploy: Publicar en Digital Ocean'
        steps:
          # Paso 1: Descargar artefactos compilados desde el stage CI
          - task: DownloadBuildArtifacts@0
            displayName: 'Deploy: Descargar artefactos de build'
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'dist-output'
              downloadPath: '$(System.ArtifactsDirectory)'

          # Paso 2: Verificar que los artefactos están disponibles
          - script: |
              echo "=== Artefactos listos para despliegue ==="
              ls -la $(System.ArtifactsDirectory)/dist-output/dist/
              echo "✓ Artefactos verificados"
            displayName: 'Deploy: Verificar artefactos'

          # Paso 3: Enviar artefactos al servidor
          - task: CopyFilesOverSSH@0
            displayName: 'Deploy: Enviar artefactos al servidor'
            inputs:
              sshEndpoint: 'digital_ocean_core'
              sourceFolder: '$(System.ArtifactsDirectory)/dist-output'
              contents: '**'
              targetFolder: '/var/www/bakery-core'
              cleanTargetFolder: false
              readyTimeout: '30000'

          # Paso 4: Instalar dependencias y reiniciar en producción
          - task: SSH@0
            displayName: 'Deploy: Instalar y reiniciar en producción'
            inputs:
              sshEndpoint: 'digital_ocean_core'
              runOptions: 'inline'
              failOnStdErr: false
              inline: |
                echo "=== Confirmando entrega en producción ==="

                # 1. Cargar entorno de Node/NVM
                export NVM_DIR="$HOME/.nvm"
                [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

                # 2. Entrar a la carpeta de despliegue
                cd /var/www/bakery-core
                echo "✓ Directorio: $(pwd)"

                # 3. Activar corepack y pnpm
                corepack enable
                corepack prepare pnpm@9.15.9 --activate
                echo "✓ pnpm activado"

                # 4. Instalar dependencias de producción
                export NODE_NO_WARNINGS=1
                CI=true pnpm install --prod --frozen-lockfile --ignore-scripts
                echo "✓ Dependencias instaladas"

                # 5. Crear archivo .env con variables del pipeline
                echo "DATABASE_URL=$(DATABASE_URL)" > .env
                echo "PORT=$(PORT)" >> .env
                echo "API_PREFIX=$(API_PREFIX)" >> .env
                echo "NODE_ENV=production" >> .env
                echo "NODE_NO_WARNINGS=1" >> .env
                echo "✓ Archivo .env creado"

                # 6. Reiniciar con PM2
                pm2 restart bakery_core || pm2 start dist/main.js --name "bakery_core"
                pm2 save
                echo "✓ Aplicación iniciada con PM2"

                # 7. Mostrar estado final
                echo "=== Estado de despliegue ==="
                pm2 list
              readyTimeout: '30000'
